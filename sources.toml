# Programmes officiels indexés par edu-kb.
#
# Un bloc [[source]] décrit un document, ou une partie de document (`pages`) pour les anciens
# programmes de cycle qui regroupent toutes les disciplines.
#
#   file        motif glob, cherché dans le dossier des programmes (le premier fichier trouvé est pris)
#   applies     niveau → années scolaires d'application, « 2026- » (depuis la rentrée 2026),
#               « -2027 » (jusqu'à la rentrée 2027, exclue), « 2016-2027 ».
#   headings    règles de titres : signature de style « taille/B|R/couleur » (regex), position, rang.
#               Rang 1 = domaine, 2 = niveau, 3 = rubrique ou thème, 4 = sous-rubrique.
#               Le type est corrigé d'après le texte : « Cours préparatoire » → niveau,
#               « Principes » → section, intitulé de `domaines` → domaine.
#   domaines    intitulés des domaines (utile quand le style ne les distingue pas, PDF scannés)
#   theme_under les rubriques de ces domaines sont des thèmes (culture littéraire…)
#   rubrique_kind  type donné à toutes les rubriques (« theme » pour les sciences)
#   ocr         PDF scanné : passé par ocrmypdf avant lecture
#   sommaire_until  sur la première page lue, lignes au-dessus de cette ordonnée ignorées (sommaire)
#
# Dates d'application : arrêtés publiés au BO, d'après la synthèse par niveau de direkol.fr
# (29 août 2026) ; à vérifier sur eduscol.education.gouv.fr, pages « Enseigner au cycle 2 / 3 ».

[defaults]
skip = [
    "^©",
    "^D’après le BOEN",
    "^no 25 du 22 juin 2023",
    "^Enseignements primaire et secondaire$",
    "www\\.education\\.gouv\\.fr",
    "www\\.eduscol\\.education\\.fr",
]
skip_bottom = 805

